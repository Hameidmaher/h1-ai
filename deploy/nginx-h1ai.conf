# ═══════════════════════════════════════════════════════════
#  H1-AI Nginx Configuration
# ═══════════════════════════════════════════════════════════

upstream h1ai_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

server {
    listen 80;
    listen [::]:80;
    server_name h.tailc0256.ts.net _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client
    client_max_body_size 20M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Static files — cache
    location /static/ {
        proxy_pass http://h1ai_backend;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Admin UI — cache CSS/JS
    location ~* /admin/static/.*\.(css|js|png|jpg|svg|woff2?)$ {
        proxy_pass http://h1ai_backend;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Chat API — rate limit
    location /api/chat/ {
        limit_req zone=chat_limit burst=10 nodelay;
        proxy_pass http://h1ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # SSE streaming — no buffering
    location /api/chat/stream {
        proxy_pass http://h1ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Everything else
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://h1ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
