name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: h1ai
          POSTGRES_PASSWORD: h1ai_pass
          POSTGRES_DB: h1ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run migrations
        working-directory: backend
        env:
          PGPASSWORD: h1ai_pass
        run: |
          psql -h localhost -U h1ai -d h1ai -f migrations/001_chatbot_expansion.sql || true
          psql -h localhost -U h1ai -d h1ai -f migrations/002_fix_embedding_dims.sql || true

      - name: Lint
        working-directory: backend
        run: |
          pip install ruff
          ruff check . --exit-zero

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://h1ai:h1ai_pass@localhost:5432/h1ai
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ollama
        run: |
          pytest tests/ -v --cov=. --cov-report=term-missing
        continue-on-error: true
