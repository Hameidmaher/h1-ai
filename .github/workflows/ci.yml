name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      # ─── Required by config.py ───
      JWT_SECRET_KEY: ci-test-jwt-secret-key-must-be-at-least-32-chars-long
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ENVIRONMENT: test
      DEBUG: "false"
      
      # ─── Required by config_loader.py ───
      APP_TAGLINE: "Assistant Pharmacy"
      LLM_PROVIDER: groq
      DATABASE_TYPE: sqlite
      
      # ─── Webhook ───
      WEBHOOK_API_KEY: ci-test-webhook-key-min-16-chars
      
      # ─── Optional (bypass external calls) ───
      OLLAMA_MODEL: qwen2.5:0.5b
      OLLAMA_BASE_URL: http://localhost:11434
      GROQ_API_KEY: dummy-key-for-ci
      DATABASE_URL: ""
      CORS_ORIGINS: '["http://localhost:3000"]'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Verify app imports
        working-directory: backend
        run: |
          python -c "from main import app; print('✅ App imports OK')"
      
      - name: Run tests (without coverage gate)
        working-directory: backend
        run: |
          pytest tests/ -v --tb=short -p no:cacheprovider \
            --no-header \
            -o addopts="" \
            --override-ini="addopts=-v --tb=short"
