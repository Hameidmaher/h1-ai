<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محادثة — H1-AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #0EA5E9;
            --primary-dark: #0284C7;
            --text: #0F172A;
            --text-muted: #64748B;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --border: #E2E8F0;
        }
        html, body {
            height: 100%;
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface);
            box-shadow: 0 0 40px rgba(0,0,0,0.06);
        }

        /* Header */
        .chat-header {
            padding: 12px 16px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .chat-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
        }
        .chat-logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .chat-logo-text h3 {
            font-size: 15px;
            font-weight: 700;
        }
        .chat-logo-text p {
            font-size: 11px;
            color: var(--text-muted);
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10B981;
            border-radius: 50%;
            margin-left: 4px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .chat-actions {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.15s;
        }
        .icon-btn:hover {
            background: var(--bg);
            border-color: var(--primary);
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-bottom-right-radius: 4px;
        }
        .chat-message.agent {
            align-self: flex-start;
            background: white;
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .chat-message.emergency {
            align-self: flex-start;
            background: #FEF2F2;
            border: 2px solid #EF4444;
            color: #991B1B;
            font-weight: 600;
        }
        .chat-message.system {
            align-self: center;
            background: #FEF3C7;
            color: #92400E;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 16px;
        }
        .chat-message table {
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 12px;
            display: block;
            overflow-x: auto;
            max-width: 100%;
        }
        .chat-message th, .chat-message td {
            border: 1px solid var(--border);
            padding: 6px 10px;
            text-align: right;
        }
        .chat-message th {
            background: var(--bg);
            font-weight: 600;
        }
        .chat-message strong { color: var(--primary-dark); }
        .chat-message code {
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }

        /* Typing indicator */
        .typing-indicator {
            align-self: flex-start;
            padding: 12px 18px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            display: flex;
            gap: 4px;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #94A3B8;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        /* Quick actions */
        .quick-actions {
            padding: 8px 16px;
            background: white;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .quick-actions::-webkit-scrollbar { display: none; }
        .quick-action {
            padding: 6px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
            font-family: inherit;
        }
        .quick-action:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Input */
        .chat-input {
            padding: 10px 12px;
            background: white;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .chat-input textarea {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            max-height: 120px;
            min-height: 44px;
            outline: none;
            transition: border 0.15s;
        }
        .chat-input textarea:focus {
            border-color: var(--primary);
        }
        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .send-btn:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: scale(1.05);
        }
        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Login prompt */
        .login-prompt {
            padding: 12px 16px;
            background: #FEF3C7;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #92400E;
        }
        .login-prompt a {
            color: var(--primary-dark);
            font-weight: 600;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .chat-message { max-width: 90%; font-size: 13px; }
            .chat-header { padding: 10px 12px; }
            .chat-messages { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <a href="/" class="chat-logo">
                <div class="chat-logo-icon">🏥</div>
                <div class="chat-logo-text">
                    <h3>H1-AI <span class="status-dot"></span></h3>
                    <p>مساعد الصيدلة الذكي</p>
                </div>
            </a>
            <div class="chat-actions">
                <button class="icon-btn" onclick="toggleTheme()" title="تبديل الوضع" id="theme-btn">🌙</button>
                <button class="icon-btn" onclick="clearChat()" title="مسح المحادثة">🗑️</button>
            </div>
        </div>

        <!-- Messages -->
        <div class="chat-messages" id="chat-messages">
            <div class="chat-message agent">
                أهلاً بك في <strong>H1-AI</strong>! 👋<br>
                كيف يمكنني مساعدتك اليوم؟<br><br>
                يمكنك السؤال عن:
                <ul style="margin: 6px 0; padding-right: 20px;">
                    <li>💰 أسعار الأدوية</li>
                    <li>💊 تفاعلات الأدوية</li>
                    <li>📦 توفر المنتجات</li>
                    <li>🩺 استشارات عامة</li>
                </ul>
            </div>
        </div>

        <!-- Quick actions -->
        <div class="quick-actions">
            <button class="quick-action" onclick="sendQuick('السلام عليكم')">👋 السلام</button>
            <button class="quick-action" onclick="sendQuick('بكام البانادول')">💰 أسعار</button>
            <button class="quick-action" onclick="sendQuick('عندي صداع')">🤕 صداع</button>
            <button class="quick-action" onclick="sendQuick('عندي ألم في الصدر')">🚨 طوارئ</button>
            <button class="quick-action" onclick="sendQuick('عايز فيتامين سي')">💊 فيتامين</button>
        </div>

        <!-- Input -->
        <div class="chat-input">
            <textarea id="chat-input" placeholder="اكتب رسالتك..." rows="1"></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()">📤</button>
        </div>
    </div>

    <script src="/customer/static/chat.js"></script>
</body>
</html>
