<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H1-AI — مساعدك الصيدلي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Cairo,system-ui,sans-serif}
:root{--bg:#0a0e1a;--surface:#0f1626;--surface2:#1a2235;--border:#1e293b;--text:#e4e7eb;--muted:#94a3b8;--accent:#4ade80;--accent2:#22c55e}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.brand-icon{font-size:24px}
.user-menu{display:flex;align-items:center;gap:12px}
.user-badge{padding:6px 12px;background:var(--surface2);border-radius:20px;font-size:13px;color:var(--muted)}
.user-badge strong{color:var(--text);margin-inline-start:4px}
.btn-icon{padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;transition:.2s;font-family:inherit}
.btn-icon:hover{border-color:var(--accent)}
main{flex:1;display:grid;grid-template-columns:260px 1fr;gap:0;min-height:0}
@media(max-width:768px){main{grid-template-columns:1fr}.sidebar{display:none}}
.sidebar{background:var(--surface);border-left:1px solid var(--border);padding:20px 12px}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;color:var(--muted);cursor:pointer;text-decoration:none;transition:.2s;margin-bottom:4px}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent);color:#000;font-weight:600}
.chat-container{display:flex;flex-direction:column;height:100%;background:var(--bg)}
.chat-header{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.chat-header h2{font-size:16px;color:var(--text)}
.chat-header p{font-size:12px;color:var(--muted);margin-top:2px}
.chat-messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.welcome{text-align:center;padding:40px 20px;color:var(--muted)}
.welcome-icon{font-size:64px;margin-bottom:16px}
.welcome h3{color:var(--text);font-size:20px;margin-bottom:8px}
.suggestions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:24px;max-width:600px;margin-inline:auto}
.suggestion{padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:13px;transition:.2s;text-align:right}
.suggestion:hover{border-color:var(--accent);background:var(--surface2)}
.msg{display:flex;gap:12px;max-width:80%;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-start;flex-direction:row-reverse}
.msg.bot{align-self:flex-end}
.msg-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.msg.user .msg-avatar{background:#60a5fa;color:#fff}
.msg.bot .msg-avatar{background:var(--accent);color:#000}
.msg-content{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.6;word-wrap:break-word;white-space:pre-wrap}
.msg.user .msg-content{background:#1e40af;border-color:#1e40af;color:#fff}
.msg-tools{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;font-size:11px}
.tool-badge{padding:2px 8px;background:rgba(74,222,128,.15);color:var(--accent);border-radius:10px}
.chat-input{padding:16px 24px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:10px}
.chat-input input{flex:1;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;font-family:inherit}
.chat-input input:focus{outline:none;border-color:var(--accent)}
.btn-send{padding:14px 24px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit;transition:.2s}
.btn-send:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(74,222,128,.3)}
.btn-send:disabled{opacity:.5;cursor:not-allowed;transform:none}
.typing{display:flex;gap:4px;padding:16px 20px}
.typing span{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-8px);opacity:1}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="brand-icon">🏥</span> H1-AI</div>
  <div class="user-menu">
    <span class="user-badge">👤 <strong id="userName">—</strong></span>
    <button class="btn-icon" onclick="logout()">🚪 خروج</button>
  </div>
</header>
<main>
  <aside class="sidebar">
    <a class="nav-item active" onclick="showSection('chat')">💬 المساعد</a>
    <a class="nav-item" onclick="showSection('history')">📜 المحادثات</a>
    <a class="nav-item" onclick="showSection('profile')">👤 الملف الشخصي</a>
    <a class="nav-item" onclick="showSection('about')">ℹ️ عن التطبيق</a>
  </aside>
  <div class="chat-container">
    <div class="chat-header">
      <h2>💬 مساعدك الصيدلي الذكي</h2>
      <p>اسألني عن أي دواء، أعراض، أو استشارة صحية</p>
    </div>
    <div class="chat-messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">💊</div>
        <h3>أهلاً بك في H1-AI</h3>
        <p>اسألني عن أي شيء يخص صحتك أو الأدوية</p>
        <div class="suggestions">
          <div class="suggestion" onclick="sendSuggestion('عايز حاجة للصداع')">🤕 عايز حاجة للصداع</div>
          <div class="suggestion" onclick="sendSuggestion('إيه بديل البنادول؟')">💊 إيه بديل البنادول؟</div>
          <div class="suggestion" onclick="sendSuggestion('إيه أعراض الأنفلونزا؟')">🤒 أعراض الأنفلونزا</div>
          <div class="suggestion" onclick="sendSuggestion('عندك فيتامين سي؟')">🍊 عندك فيتامين سي؟</div>
        </div>
      </div>
    </div>
    <form class="chat-input" id="chatForm" onsubmit="sendMessage(event)">
      <input type="text" id="msgInput" placeholder="اكتب سؤالك هنا..." autocomplete="off" required>
      <button type="submit" class="btn-send" id="sendBtn">إرسال ↵</button>
    </form>
  </div>
</main>
<script>
const TOKEN = localStorage.getItem('h1ai_user_token');
const USER = JSON.parse(localStorage.getItem('h1ai_user') || 'null');

if (!TOKEN || !USER) {
  window.location.href = '/login';
}

document.getElementById('userName').textContent = USER.full_name || USER.username;

function logout() {
  localStorage.removeItem('h1ai_user_token');
  localStorage.removeItem('h1ai_user');
  window.location.href = '/login';
}

function addMessage(role, text, tools) {
  const messages = document.getElementById('messages');
  document.getElementById('welcome')?.remove();
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  const toolBadges = tools && tools.length
    ? `<div class="msg-tools">${tools.map(t => `<span class="tool-badge">🔧 ${t.name || t}</span>`).join('')}</div>`
    : '';
  el.innerHTML = `
    <div class="msg-avatar">${role === 'user' ? '👤' : '🤖'}</div>
    <div>
      <div class="msg-content">${text.replace(/</g, '&lt;')}</div>
      ${toolBadges}
    </div>
  `;
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
  return el;
}

function addTyping() {
  const messages = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.id = 'typing';
  el.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div class="msg-content">
      <div class="typing"><span></span><span></span><span></span></div>
    </div>
  `;
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
}

function removeTyping() {
  document.getElementById('typing')?.remove();
}

function sendSuggestion(text) {
  document.getElementById('msgInput').value = text;
  sendMessage(new Event('submit'));
}

async function sendMessage(e) {
  e.preventDefault();
  const input = document.getElementById('msgInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  document.getElementById('sendBtn').disabled = true;

  addMessage('user', msg);
  addTyping();

  try {
    const r = await fetch('/v1/user/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${TOKEN}`,
      },
      body: JSON.stringify({ message: msg }),
    });
    removeTyping();
    if (r.status === 401) {
      logout();
      return;
    }
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'خطأ');
    addMessage('bot', d.reply, (d.tools_used || []).map(n => ({ name: n })));
  } catch(ex) {
    removeTyping();
    addMessage('bot', '❌ ' + ex.message);
  }
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

function showSection(s) {
  if (s !== 'chat') {
    alert('قيد التطوير — ' + s);
    return;
  }
}

document.getElementById('msgInput').focus();
</script>
</body>
</html>
