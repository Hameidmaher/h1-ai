<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H1-AI — Admin Dashboard</title>
  <link rel="stylesheet" href="/admin/static/app.css">
  <link rel="stylesheet" href="/admin/static/css/mobile.css">
  <link rel="stylesheet" href="/admin/static/css/dark.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
  <link rel="stylesheet" href="/admin/static/css/responsive-fix.css?v=1">
  <link rel="stylesheet" href="/admin/static/css/mobile-sidebar-fix.css?v=1">
  <link rel="stylesheet" href="/admin/static/css/sidebar-force-fix.css?v=10">
  <link rel="stylesheet" href="/admin/static/css/pages-responsive.css?v=1">
  <script src="/admin/static/lib/chart.min.js"></script>
</head>
<body>
<!-- Mobile Menu -->
<button class="mobile-menu-btn" onclick="App.toggleMobileMenu()" aria-label="القائمة">☰</button>
<div class="mobile-overlay" onclick="App.toggleMobileMenu()"></div>

<!-- Theme Toggle -->
<button class="theme-toggle" onclick="App.toggleTheme()" title="تبديل الوضع">🌙</button>


<!-- Login Screen -->
<div id="login-screen" class="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <h1>H1-AI</h1>
      <p>Assistant Pharmacy</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="username" placeholder="اسم المستخدم" autocomplete="username">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">دخول</button>
      <div id="login-error" class="error-msg"></div>
    </form>
  </div>
</div>

<!-- Main App -->
<div id="app" class="app hidden">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <h2>H1-AI</h2>
      <span>Admin</span>
    </div>
    <nav class="nav">
      <a href="#dashboard" class="nav-item" data-page="dashboard">
        <span class="icon">📊</span> لوحة التحكم
      </a>
      <a href="#products" class="nav-item" data-page="products">
        <span class="icon">📦</span> المنتجات
      </a>
      <a href="#drugs" class="nav-item" data-page="drugs">
        <span class="icon">💊</span> الأدوية
      </a>
      <a href="#conditions" class="nav-item" data-page="conditions">
        <span class="icon">🩺</span> الحالات
      </a>
      <a href="#interactions" class="nav-item" data-page="interactions">
        <span class="icon">⚠️</span> التداخلات
      </a>
      <a href="#synonyms" class="nav-item" data-page="synonyms">
        <span class="icon">📚</span> المرادفات
      </a>
      <a href="#audit" class="nav-item" data-page="audit">
        <span class="icon">📜</span> سجل التعديلات
      </a>
      <a href="#chat" class="nav-item" data-page="chat">
        <span class="icon">💬</span> Chat تجريبي
      </a>
      <a href="#pharmacies" class="nav-item" data-page="pharmacies">
        <span class="icon">🏥</span> الصيدليات
      </a>
      <a href="#whatsapp_sessions" class="nav-item" data-page="whatsapp_sessions">
        <span class="icon">📱</span> WhatsApp
      </a>
      <a href="#live_feed" class="nav-item" data-page="live_feed">
        <span class="icon">📡</span> البث الحي
      </a>
      <a href="#analytics" class="nav-item" data-page="analytics">
        <span class="icon">📈</span> التحليلات
      </a>
      <a href="#subscriptions" class="nav-item" data-page="subscriptions">
        <span class="icon">💳</span> الاشتراكات
      </a>
      <a href="#feature_flags" class="nav-item" data-page="feature_flags">
        <span class="icon">🎛️</span> ميزات النظام
      </a>
      <a href="#alerts" class="nav-item" data-page="alerts">
        <span class="icon">🚨</span> التنبيهات
      </a>
      <a href="#api_keys" class="nav-item" data-page="api_keys">
        <span class="icon">🔑</span> مفاتيح API
      </a>
      <a href="#activity_log" class="nav-item" data-page="activity_log">
        <span class="icon">📜</span> سجل النشاطات
      </a>
      <a href="#settings" class="nav-item" data-page="settings">
        <span class="icon">⚙️</span> الإعدادات
      </a>
    </nav>
    <div class="sidebar-footer">
      <button id="logout-btn" class="btn btn-ghost btn-sm">تسجيل خروج</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <header class="topbar">
      <h1 id="page-title">لوحة التحكم</h1>
      <div class="user-info" style="display:flex;align-items:center;gap:12px">
        <button onclick="App.showNotifications()" style="position:relative;background:none;border:none;cursor:pointer;font-size:20px" title="الإشعارات">
          🔔
          <span id="notif-badge" style="display:none;position:absolute;top:-4px;left:-4px;background:#EF4444;color:white;font-size:10px;border-radius:50%;width:18px;height:18px;align-items:center;justify-content:center;font-weight:600">0</span>
        </button>
        <span id="user-name">admin</span>
      </div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Modal -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button id="modal-close" class="btn btn-ghost">✕</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-footer" class="modal-footer"></div>
  </div>
</div>

<script src="/admin/static/app.js"></script>
<script src="/admin/static/js/charts.js"></script>
<script src="/admin/static/pages/products.js"></script>
<script src="/admin/static/pages/drugs.js"></script>
<script src="/admin/static/pages/conditions.js"></script>
<script src="/admin/static/pages/interactions.js"></script>
<script src="/admin/static/pages/synonyms.js"></script>
<script src="/admin/static/pages/audit.js"></script>
<script src="/admin/static/pages/settings.js"></script>
<script src="/admin/static/pages/pharmacies.js"></script>
<script src="/admin/static/pages/whatsapp-sessions.js"></script>
<script src="/admin/static/pages/live-feed.js"></script>
<script src="/admin/static/pages/chat.js"></script>
<script>App.init();</script>
<script src="/admin/static/pages/subscriptions.js"></script>
<script src="/admin/static/pages/feature-flags.js"></script>
<script src="/admin/static/pages/alerts.js"></script>
<script src="/admin/static/pages/api-keys.js"></script>
<script src="/admin/static/pages/analytics.js"></script>
<script src="/admin/static/pages/activity-log.js"></script>
<script src="/admin/static/pages/dashboard-enhanced.js"></script>
</body>
</html>
