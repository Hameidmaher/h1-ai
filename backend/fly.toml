app = "h1-ai-api"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"

[checks.health]
  type = "http"
  port = 8000
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
