<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اربط WhatsApp صيدليتك — H1-AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #E0F2FE, #F8FAFC); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 500px; width: 100%; background: white; border-radius: 20px; padding: 32px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo-icon { font-size: 60px; }
        .logo h1 { font-size: 32px; color: #0EA5E9; margin-top: 8px; }
        .logo p { color: #64748B; margin-top: 4px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #475569; }
        .field input { width: 100%; padding: 12px 16px; border: 1px solid #E2E8F0; border-radius: 10px; font-family: inherit; font-size: 15px; }
        .field input:focus { outline: none; border-color: #0EA5E9; box-shadow: 0 0 0 3px rgba(14,165,233,0.1); }
        .btn { width: 100%; padding: 14px; background: #0EA5E9; color: white; border: none; border-radius: 10px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.15s; margin-top: 8px; }
        .btn:hover { background: #0284C7; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .hidden { display: none !important; }
        .error { background: #FEF2F2; color: #991B1B; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .qr-image { max-width: 100%; border-radius: 12px; margin: 16px 0; }
        .hint { background: #F8FAFC; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.6; color: #475569; }
        .success-icon { font-size: 80px; text-align: center; margin: 16px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">🏥</div>
            <h1>H1-AI</h1>
            <p>اربط WhatsApp صيدليتك في دقيقة واحدة</p>
        </div>

        <div id="step-1">
            <h2 style="margin-bottom: 16px; font-size: 20px;">👋 أهلاً بك</h2>
            <div id="error-box" class="error hidden"></div>

            <div class="field">
                <label>اسم الصيدلية *</label>
                <input type="text" id="pharmacy-name" placeholder="صيدلية النور">
            </div>
            <div class="field">
                <label>البريد الإلكتروني *</label>
                <input type="email" id="email" placeholder="info@pharmacy.com" dir="ltr">
            </div>
            <div class="field">
                <label>رقم WhatsApp *</label>
                <input type="tel" id="phone" placeholder="+201234567890" dir="ltr">
            </div>
            <div class="field">
                <label>كلمة المرور *</label>
                <input type="password" id="password" placeholder="8 أحرف على الأقل">
            </div>

            <button class="btn" id="btn-register" onclick="register()">🚀 إنشاء الحساب</button>
        </div>

        <div id="step-2" class="hidden">
            <h2 style="margin-bottom: 16px; font-size: 20px;">📱 امسح الكود</h2>
            <img id="qr-image" class="qr-image" src="" alt="QR">
            <div class="hint">
                <strong>الخطوات:</strong><br>
                1. افتح WhatsApp<br>
                2. Settings → Linked Devices<br>
                3. Link a Device<br>
                4. امسح الكود
            </div>
            <div id="status-text" style="text-align: center; margin-top: 16px; color: #F59E0B; font-weight: 600;">⏳ بانتظار المسح...</div>
        </div>

        <div id="step-3" class="hidden">
            <div class="success-icon">🎉</div>
            <h2 style="text-align: center; margin-bottom: 16px;">تم الربط بنجاح!</h2>
            <div class="hint">
                ✅ صيدليتك متصلة بـ H1-AI<br>
                الـ AI هيبدأ يرد على العملاء تلقائياً
            </div>
            <button class="btn" onclick="window.location.href='/admin'">🚀 افتح Dashboard</button>
        </div>
    </div>

    <script>
        let sessionId = null;
        let checkInterval = null;

        function showError(msg) {
            const box = document.getElementById('error-box');
            box.textContent = msg;
            box.classList.remove('hidden');
        }

        async function register() {
            const name = document.getElementById('pharmacy-name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;

            if (!name || !email || !phone || !password) {
                showError('⚠️ املأ كل الحقول');
                return;
            }
            if (password.length < 8) {
                showError('⚠️ كلمة المرور 8 أحرف على الأقل');
                return;
            }

            const btn = document.getElementById('btn-register');
            btn.disabled = true;
            btn.textContent = '⏳ جاري الإنشاء...';

            try {
                const res = await fetch('/v1/public/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pharmacy_name: name,
                        email: email,
                        phone: phone,
                        password: password,
                    }),
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.detail || '❌ فشل الإنشاء');
                    btn.disabled = false;
                    btn.textContent = '🚀 إنشاء الحساب';
                    return;
                }

                sessionId = data.session_id;
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');

                await loadQR();
                startPolling();
            } catch (e) {
                showError('❌ خطأ: ' + e.message);
                btn.disabled = false;
                btn.textContent = '🚀 إنشاء الحساب';
            }
        }

        async function loadQR() {
            try {
                const res = await fetch(`/v1/public/qr/${encodeURIComponent(sessionId)}`);
                const data = await res.json();
                if (data.qr_image) {
                    document.getElementById('qr-image').src = data.qr_image;
                }
            } catch (e) {
                console.error('QR error:', e);
            }
        }

        function startPolling() {
            checkInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/v1/public/status/${encodeURIComponent(sessionId)}`);
                    const data = await res.json();
                    if (data.status === 'connected') {
                        clearInterval(checkInterval);
                        document.getElementById('step-2').classList.add('hidden');
                        document.getElementById('step-3').classList.remove('hidden');
                    }
                } catch (e) {}
            }, 3000);
        }
    </script>
</body>
</html>
