version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=dev
      - JWT_SECRET_KEY=dev_only_change_in_production
    volumes:
      - ./data:/app/data:ro
      - ./backend/chroma_db:/app/chroma_db
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
